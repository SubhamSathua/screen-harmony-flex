name: ScreenHarmony Flex Release CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (leave empty to use version from version.properties, e.g., v2.8.5)'
        required: false
        default: ''
        type: string
      is_prerelease:
        description: 'Mark this release as a Pre-Release'
        required: false
        default: false
        type: boolean
      is_draft:
        description: 'Mark this release as a Draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version, Tag & Pre-Release Status
        id: release_info
        run: |
          # 1. Read version from version.properties
          PROPS_FILE="version.properties"
          if [ -f "$PROPS_FILE" ]; then
            MAJOR=$(grep "^VERSION_MAJOR=" "$PROPS_FILE" | cut -d'=' -f2 | tr -d ' \r\n')
            MINOR=$(grep "^VERSION_MINOR=" "$PROPS_FILE" | cut -d'=' -f2 | tr -d ' \r\n')
            PATCH=$(grep "^VERSION_PATCH=" "$PROPS_FILE" | cut -d'=' -f2 | tr -d ' \r\n')
            CODE=$(grep "^VERSION_CODE=" "$PROPS_FILE" | cut -d'=' -f2 | tr -d ' \r\n')
          fi
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}
          CODE=${CODE:-1}
          DEFAULT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          VERSION_NUM="${MAJOR}.${MINOR}.${PATCH}"

          # Determine Tag
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$DEFAULT_TAG"
          fi

          # Clean version string (remove leading v)
          CLEAN_VER="${TAG#v}"

          # Determine Pre-Release status
          IS_PRERELEASE="false"
          if [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          elif [[ "$TAG" =~ -(alpha|beta|rc|preview|dev|snapshot) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          IS_DRAFT="false"
          if [ "${{ github.event.inputs.is_draft }}" = "true" ]; then
            IS_DRAFT="true"
          fi

          echo "Detected TAG: $TAG"
          echo "Detected Version: $CLEAN_VER (Code: $CODE)"
          echo "Is Pre-Release: $IS_PRERELEASE"
          echo "Is Draft: $IS_DRAFT"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$CLEAN_VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes (.github/release-notes/<tag>.md)
        id: release_notes
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          VER="${{ steps.release_info.outputs.version }}"
          NOTES_FILE=""

          # Check candidate paths
          if [ -f ".github/release-notes/${TAG}.md" ]; then
            NOTES_FILE=".github/release-notes/${TAG}.md"
          elif [ -f ".github/release-notes/${VER}.md" ]; then
            NOTES_FILE=".github/release-notes/${VER}.md"
          elif [ -f ".github/release-notes/v${VER}.md" ]; then
            NOTES_FILE=".github/release-notes/v${VER}.md"
          elif [ -f "${TAG}.md" ]; then
            NOTES_FILE="${TAG}.md"
          elif [ -f "${VER}.md" ]; then
            NOTES_FILE="${VER}.md"
          fi

          OUTPUT_NOTES_PATH="$RUNNER_TEMP/RELEASE_NOTES.md"

          if [ -n "$NOTES_FILE" ] && [ -f "$NOTES_FILE" ]; then
            echo "✅ Found release notes at: $NOTES_FILE"
            cat "$NOTES_FILE" > "$OUTPUT_NOTES_PATH"
          else
            echo "ℹ️ No custom release notes file found for $TAG. Generating fallback changelog (NO ERROR)."
            cat << 'EOF' > "$OUTPUT_NOTES_PATH"
          # ScreenHarmony Flex Release ${{ steps.release_info.outputs.tag }}

          ### What's New
          - General improvements and optimizations for **ScreenHarmony Flex**.
          - Device synchronization and remote-control resilience enhancements.

          *(Full automated commit changelog below)*
          EOF
          fi

          echo "notes_path=$OUTPUT_NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Google Services & Keystore
        run: |
          # 1. Google Services JSON
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Using GOOGLE_SERVICES_JSON from secrets..."
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Creating mock google-services.json for build..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "screenharmony-flex",
              "storage_bucket": "screenharmony-flex.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.prism.screenharmony.flex"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key_ci" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123457",
                  "android_client_info": {
                    "package_name": "com.prism.screenharmony.flex.alpha"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "dummy_key_ci" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 2. Keystore setup
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
            cat << EOF > keystore.properties
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD || 'screenharmony123' }}
          keyAlias=${{ secrets.KEY_ALIAS || 'screenharmony' }}
          keyPassword=${{ secrets.KEY_PASSWORD || 'screenharmony123' }}
          EOF
          elif [ ! -f "keystore.properties" ] || [ ! -f "release.jks" ]; then
            echo "Generating fallback CI signing keystore..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias screenharmony \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass screenharmony123 \
              -keypass screenharmony123 \
              -dname "CN=ScreenHarmony, OU=Flex, O=Prism, L=City, S=State, C=US"
            
            cat << 'EOF' > keystore.properties
          storeFile=release.jks
          storePassword=screenharmony123
          keyAlias=screenharmony
          keyPassword=screenharmony123
          EOF
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Release APKs & Bundles
        run: |
          ./gradlew assembleProdRelease assembleAlphaRelease bundleProdRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseG1GC" --stacktrace

      - name: Prepare Artifacts for Release
        id: prepare_files
        run: |
          mkdir -p release-artifacts

          # Copy APKs
          find app/build/outputs/apk/prod/release -name "*.apk" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          find app/build/outputs/apk/alpha/release -name "*.apk" -exec cp {} release-artifacts/ \; 2>/dev/null || true

          # Copy AAB Bundle
          find app/build/outputs/bundle/prodRelease -name "*.aab" -exec cp {} release-artifacts/ \; 2>/dev/null || true

          echo "Listing release artifacts to upload:"
          ls -lah release-artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "ScreenHarmony Flex ${{ steps.release_info.outputs.tag }}"
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          draft: ${{ steps.release_info.outputs.is_draft == 'true' }}
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
